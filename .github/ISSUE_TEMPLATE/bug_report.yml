name: Bug report
description: Something in the launcher does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Two buttons in the launcher collect most of what we need:
        - **Debug-Info kopieren** (Einstellungen › Support, or the instance's *Protokoll* tab) copies launcher version, Windows version and your instances — without names, accounts or paths.
        - **Log teilen** (the instance's *Protokoll* tab, or next to *Minecraft ist abgestürzt*) uploads the game log or crash report to mclo.gs and copies the link. Access tokens, your Windows user name and e-mail addresses are removed first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Einstellungen › Über Pumpkin Launcher. Not needed if you paste the debug info below, which starts with the version.
      placeholder: "0.1.0"
  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: Click **Debug-Info kopieren** in Einstellungen › Support and paste it here.
      render: text
  - type: input
    id: log
    attributes:
      label: Log link (mclo.gs)
      description: For crashes and failed starts, click **Log teilen** in the instance's *Protokoll* tab and paste the copied link.
      placeholder: https://mclo.gs/…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images in here if they help to show the problem.
