name: Mojang keys

# Early warning for the friends directory: the Worker pins Mojang's player-certificate keys (directory/src/mojang-keys.js)
# because it cannot fetch them itself. A failing run means Mojang's list changed: run
# `node directory/scripts/mojang-keys.mjs update`, then `node directory/test.mjs`, a PR and `npx wrangler deploy`.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compare the pinned keys with Mojang's live list
        run: node directory/scripts/mojang-keys.mjs check

  # GitHub disables scheduled workflows of a public repository after 60 days without activity, which would silence
  # this check. Enabling the workflow through the API counts as activity; it runs on its own so a failing check
  # cannot skip it.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/mojang-keys.yml/enable"
