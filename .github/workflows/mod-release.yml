name: Mod release

# Nur von Hand (workflow_dispatch) und nur von main: baut die Fabric-Mod aus mod/ und lädt die Jar zu Modrinth hoch.
# Lieferkettenregeln: docs/friends/SPEC.md, Abschnitt 11.5.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Modrinth channel. The launcher installs only "release" versions.
        type: choice
        options: [release, beta, alpha]
        default: release
      changelog:
        description: Changelog shown on Modrinth
        type: string
        required: true

permissions: {}

concurrency:
  group: mod-release
  cancel-in-progress: false

env:
  # Das Modrinth-Projekt, dem der Launcher als einzigem vertraut (MOD_PROJECT_ID in services/friends/modinstall.rs).
  # Leer, bis der Eigentümer das Projekt angelegt hat; beide Stellen müssen denselben Wert tragen.
  MOD_PROJECT_ID: ""
  MOD_ID: pumpkin_friends
  FABRIC_API_PROJECT_ID: P7dR8mSH
  GAME_VERSION: "26.3"

jobs:
  # Baut ohne Zugriff auf das Token: Gradle führt Build-Skripte und Plugins aus, die das Secret nie sehen dürfen.
  build:
    name: Build and test the jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.jar.outputs.version }}
      jar_name: ${{ steps.jar.outputs.jar_name }}
      jar_sha256: ${{ steps.jar.outputs.jar_sha256 }}
    steps:
      - name: Only main can be released
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The mod is released from main only, not from $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Scheitert vor der Freigabe, nicht erst danach: Projekt-ID gesetzt und identisch mit der des Launchers.
      - name: Check the pinned project id against the launcher
        run: |
          if ! printf '%s' "$MOD_PROJECT_ID" | grep -Eq '^[A-Za-z0-9]{8}$'; then
            echo "::error::MOD_PROJECT_ID in this workflow is not a Modrinth project id (8 characters)."
            exit 1
          fi
          if ! grep -Fq "MOD_PROJECT_ID: &str = \"$MOD_PROJECT_ID\"" src-tauri/src/services/friends/modinstall.rs; then
            echo "::error::MOD_PROJECT_ID differs from the constant in src-tauri/src/services/friends/modinstall.rs."
            exit 1
          fi

      # Ohne Cache: Ein Release-Build soll nichts aus einem früheren Lauf wiederverwenden.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: gradlew build test
        working-directory: mod
        run: ./gradlew build test

      - name: Pick the jar
        id: jar
        working-directory: mod
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=mod/gradle.properties::version '$version' is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          jar_name="${MOD_ID}-${version}.jar"
          jar="build/libs/$jar_name"
          declared_id=$(unzip -p "$jar" fabric.mod.json | jq -r .id)
          declared_version=$(unzip -p "$jar" fabric.mod.json | jq -r .version)
          if [ "$declared_id" != "$MOD_ID" ] || [ "$declared_version" != "$version" ]; then
            echo "::error::$jar_name declares $declared_id $declared_version in fabric.mod.json."
            exit 1
          fi
          {
            echo "version=$version"
            echo "jar_name=$jar_name"
            echo "jar_sha256=$(sha256sum "$jar" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-jar
          path: mod/build/libs/${{ steps.jar.outputs.jar_name }}
          if-no-files-found: error
          retention-days: 7

  # Das Secret gehört der Umgebung; deren Pflichtprüfer geben jeden Lauf frei. Dieser Job führt nur die geprüfte Jar hoch.
  publish:
    name: Upload to Modrinth
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: modrinth-release
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      JAR_NAME: ${{ needs.build.outputs.jar_name }}
      JAR_SHA256: ${{ needs.build.outputs.jar_sha256 }}
      VERSION_TYPE: ${{ inputs.version_type }}
      CHANGELOG: ${{ inputs.changelog }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mod-jar

      - name: Check the jar is the one that was built
        run: echo "$JAR_SHA256  $JAR_NAME" | sha256sum --check --strict

      # Das Token steht nie in der Argumentliste: curl liest den Header per -K von stdin (printf ist ein Builtin).
      - name: Create the Modrinth version
        run: |
          api=https://api.modrinth.com/v2
          modrinth() {
            printf 'header = "Authorization: %s"\n' "$MODRINTH_TOKEN" |
              curl --fail-with-body --silent --show-error -K - \
                --user-agent "jonax1337/pumpkin-launcher mod-release workflow" "$@"
          }

          project_id=$(modrinth "$api/project/$MOD_PROJECT_ID" | jq -r .id)
          if [ "$project_id" != "$MOD_PROJECT_ID" ]; then
            echo "::error::Modrinth returned project '$project_id' for the pinned MOD_PROJECT_ID."
            exit 1
          fi

          if modrinth "$api/project/$MOD_PROJECT_ID/version" | jq -e --arg v "$VERSION" 'any(.[]; .version_number == $v)' > /dev/null; then
            echo "::error::Version $VERSION already exists on Modrinth. Bump version in mod/gradle.properties."
            exit 1
          fi

          jq -n \
            --arg project_id "$MOD_PROJECT_ID" \
            --arg version "$VERSION" \
            --arg version_type "$VERSION_TYPE" \
            --arg changelog "$CHANGELOG" \
            --arg game_version "$GAME_VERSION" \
            --arg fabric_api "$FABRIC_API_PROJECT_ID" \
            '{
              project_id: $project_id,
              name: "Pumpkin Friends \($version)",
              version_number: $version,
              version_type: $version_type,
              changelog: $changelog,
              game_versions: [$game_version],
              loaders: ["fabric"],
              dependencies: [{project_id: $fabric_api, dependency_type: "required"}],
              featured: false,
              status: "listed",
              file_parts: ["file"],
              primary_file: "file"
            }' > "$RUNNER_TEMP/version.json"

          # --fail-with-body schreibt den Fehlertext von Modrinth in die Ausgabedatei; sie wird dann ausgegeben.
          if ! modrinth -X POST "$api/version" \
            -F "data=<$RUNNER_TEMP/version.json;type=application/json" \
            -F "file=@$JAR_NAME;type=application/java-archive" \
            -o "$RUNNER_TEMP/response.json"; then
            cat "$RUNNER_TEMP/response.json"
            exit 1
          fi

          version_id=$(jq -r .id "$RUNNER_TEMP/response.json")
          echo "Published $JAR_NAME as Modrinth version $version_id."
          echo "Published \`$JAR_NAME\` as Modrinth version \`$version_id\`." >> "$GITHUB_STEP_SUMMARY"
