name: Mod smoke

# Rauchtest der Einspeisung im echten Spiel (tools/mod-smoke/README.md):
# baut den Knoten und startet Minecraft unter Xvfb mit Software-GL/Vulkan über den Startweg des Launchers.
# `nodes.txt` is the sole support matrix. This job attempts every target; a successful
# bridge handshake is not a claim that the interactive UI or Friends flows were checked.

on:
  schedule:
    # Nächtlich, 03:22 UTC, abseits der vollen Minuten.
    - cron: '22 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodes:
    name: Smoke target list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read nodes.txt
        id: matrix
        run: |
          matrix=$(jq -R -s -c '
            split("\n")
            | map(sub("#.*"; "") | gsub("^\\s+|\\s+$"; "") | select(length > 0) | gsub("\\s+"; " ") | split(" "))
            | map({
                cell: .[0],
                java: (.[4] | tonumber),
                testJava: (if (.[4] | tonumber) < 17 then 17 else (.[4] | tonumber) end),
                "gradle-java": (.[6] | tonumber)
              })' mod/nodes.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  smoke:
    name: Smoke ${{ matrix.cell }}
    needs: nodes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nodes.outputs.matrix) }}
    env:
      PUMPKIN_SMOKE_CELL: ${{ matrix.cell }}
      # Software-GL für den headlessen Client; erbt an das Spiel weiter.
      LIBGL_ALWAYS_SOFTWARE: '1'
      # LIBGL_ALWAYS_SOFTWARE does not select a Vulkan driver. Lavapipe supplies real X11 surfaces for 26.3.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/linux-deps

      - name: Display and software rendering
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Expose the game JDK to Gradle
        run: echo "PUMPKIN_JDK_${{ matrix.java }}=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Test JDK for Java 8 production nodes
        if: matrix.java < 17
        id: test-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Expose the test JDK
        if: matrix.java < 17
        run: echo "PUMPKIN_JDK_17=${{ steps.test-jdk.outputs.path }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.gradle-java != matrix.java
        with:
          distribution: temurin
          java-version: ${{ matrix.gradle-java }}

      - name: Expose the Gradle JDK
        run: echo "PUMPKIN_JDK_${{ matrix.gradle-java }}=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ matrix.cell }}-${{ hashFiles('mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-smoke-${{ matrix.cell }}-

      # Baut nur den Knoten der Zelle (-Pnode) samt Index und Jars.
      - name: Build the node and its index
        working-directory: mod
        run: ./gradlew -Pnode=${{ matrix.cell }} -Pcore.testJdk=${{ matrix.testJava }} build modIndex

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Run the smoke cell
        env:
          # runner-Kontext ist nur in Schritt-Env erlaubt (actionlint), daher hier und nicht im Job. Der Dist-Pfad ist
          # absolut, weil cargo die Test-Binare mit cwd im Paketverzeichnis (src-tauri) startet.
          PUMPKIN_SMOKE_DATA: ${{ runner.temp }}/smoke-data
          PUMPKIN_SMOKE_DIST: ${{ github.workspace }}/mod/build/mod-index
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            cargo test --manifest-path src-tauri/Cargo.toml --locked --features smoke --test smoke smoke_cell -- --exact --nocapture

      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report-${{ matrix.cell }}
          path: ${{ runner.temp }}/smoke-data/smoke-reports/
          if-no-files-found: ignore
