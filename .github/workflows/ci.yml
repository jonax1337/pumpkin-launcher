name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build & checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (incl. branding icon sync)
        run: pnpm build

      - name: Build website
        run: pnpm build:website

      - name: Check branding calendar & assets
        run: pnpm check:branding

      - name: Check frontend helpers (Modrinth, formatting, routes)
        run: pnpm check:lib

      - name: Check website links & assets
        run: pnpm check:website

      - name: Check friends directory worker (routes, limits, cron, golden vectors)
        run: node directory/test.mjs

  backend:
    name: Backend (cargo check & test, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Nur Warnungen: Der Bestand an Funden wird erst abgebaut, bevor `-D warnings` den Build bricht.
      - name: cargo clippy (warnings only)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Windows credential persistence and legacy encoding
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::secrets::tests::long_text_survives_keyring -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::secrets::tests::legacy_utf16_secret_is_read_without_reencoding_the_credential -- --ignored --exact --test-threads=1

      - name: Linux credential persistence and service recovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y dbus gnome-keyring libglib2.0-bin
          dbus-run-session -- bash -euo pipefail <<'KEYRING_SMOKE'
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          smoke_home="$(mktemp -d)"
          daemon_pid=
          cleanup() {
            if [ -n "$daemon_pid" ]; then
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_home"
          }
          trap cleanup EXIT
          export HOME="$smoke_home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_RUNTIME_DIR="$HOME/run"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          mkdir -m 700 "$XDG_RUNTIME_DIR" "$HOME/control"
          unset GNOME_KEYRING_CONTROL GNOME_KEYRING_PID
          gnome-keyring-daemon --foreground --unlock --components=secrets --control-directory="$HOME/control" <<< 'pumpkin-smoke-password' &
          daemon_pid=$!
          gdbus wait --session --timeout 15 org.freedesktop.secrets
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::secrets::tests::long_text_survives_keyring -- --ignored --exact --test-threads=1
          PUMPKIN_KEYRING_SMOKE_ISOLATED=1 cargo test --manifest-path src-tauri/Cargo.toml --locked --lib services::secrets::tests::failed_secret_service_initialization_can_recover -- --ignored --exact --test-threads=1
          KEYRING_SMOKE

  audit:
    name: Dependencies (cargo deny advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
