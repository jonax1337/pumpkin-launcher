name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build & checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (incl. branding icon sync)
        run: pnpm build

      - name: Build website
        run: pnpm build:website

      - name: Check branding calendar & assets
        run: pnpm check:branding

      - name: Check frontend helpers (Modrinth, formatting, routes)
        run: pnpm check:lib

      - name: Check website links & assets
        run: pnpm check:website

  backend:
    name: Backend (cargo check & test, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Nur Warnungen: Der Bestand an Funden wird erst abgebaut, bevor `-D warnings` den Build bricht.
      - name: cargo clippy (warnings only)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  audit:
    name: Dependencies (cargo deny advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
