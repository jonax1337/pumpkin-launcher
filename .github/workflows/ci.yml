name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build & checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (incl. branding icon sync)
        run: pnpm build

      - name: Build website
        run: pnpm build:website

      - name: Check branding calendar & assets
        run: pnpm check:branding

      - name: Check frontend helpers (Modrinth, formatting)
        run: pnpm check:lib

      - name: Check website links & assets
        run: pnpm check:website

  backend:
    name: Backend (cargo check & test, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
