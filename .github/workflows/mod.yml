name: Mod

# Baut die In-Game-Mod (mod/, docs/friends/INGAME.md 4.3 und 11.2) für jeden Knoten aus mod/nodes.txt: ein Job pro Knoten
# mit dem JDK, das nodes.txt für ihn nennt. Das Ergebnis ist ein Artefakt "mod-index" mit mod-index.json und allen Jars.
# Noch kein Rauchtest (Paket S2): kein Knoten wird hier als "verified" markiert.

on:
  push:
    branches: [main]
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Die Knotenliste kommt aus mod/nodes.txt; nur dort wird ein Knoten angelegt.
  nodes:
    name: Node list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # java = JDK des Spiels, gradleJava = JDK für Gradle (mindestens mod.gradleJdkMin), family = Cache-Familie.
      - name: Read nodes.txt
        id: matrix
        run: |
          gradle_jdk_min=$(sed -n 's/^mod\.gradleJdkMin=//p' mod/gradle.properties)
          matrix=$(jq -R -s -c --argjson min "$gradle_jdk_min" '
            split("\n")
            | map(sub("#.*"; "") | gsub("^\\s+|\\s+$"; "") | select(length > 0) | gsub("\\s+"; " ") | split(" "))
            | map((.[4] | tonumber) as $java | {
                id: .[0],
                loader: .[1],
                java: $java,
                gradleJava: (if $java > $min then $java else $min end),
                family: (if .[1] == "fabric" then "fabric-remap" elif .[1] == "neoforge" then "neoforge" else "legacyforge" end)
              })' mod/nodes.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Schichtenregeln und Skript-Spezifikationen: kein Gradle, kein Minecraft.
  checks:
    name: Layer rules and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: check-conditionals (specification)
        run: node mod/scripts/check-conditionals.check.mjs

      - name: check-conditionals (tree)
        run: node mod/scripts/check-conditionals.mjs

      - name: validate-mod-index (specification)
        run: node mod/scripts/validate-mod-index.check.mjs

  build:
    name: Node ${{ matrix.id }}
    needs: [nodes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.nodes.outputs.matrix) }}
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Volle Temurin-JDKs wie scripts/dev-env.sh; Mojangs mitgelieferte Laufzeiten haben kein javac.
      - name: Game JDK ${{ matrix.java }}
        id: game-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Gradle findet die JDKs der Toolchain über PUMPKIN_JDK_<Version> (gradle.properties).
      - name: Expose the game JDK to Gradle
        run: echo "PUMPKIN_JDK_${{ matrix.java }}=${{ steps.game-jdk.outputs.path }}" >> "$GITHUB_ENV"

      - name: Gradle JDK ${{ matrix.gradleJava }}
        if: matrix.gradleJava != matrix.java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.gradleJava }}

      # Ein Cache je Toolchain-Familie, nicht je Knoten: Die aufbereiteten Minecraft-Quellen sind für alle Knoten
      # einer Familie dieselben. Der Schlüssel hängt nur an dem Build-Skript der Familie.
      - name: Gradle cache (${{ matrix.family }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mod/.gradle/loom-cache
          key: gradle-${{ matrix.family }}-${{ hashFiles('mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties', format('mod/build-{0}.gradle', matrix.loader)) }}
          restore-keys: |
            gradle-${{ matrix.family }}-

      # core/ läuft auf dem JDK des Knotens: so ist belegt, dass es auf jedem Knoten läuft (-Pcore.testJdk).
      - name: Build and test
        run: ./gradlew -Pnode=${{ matrix.id }} -Pcore.testJdk=${{ matrix.java }} build modIndex

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-node-${{ matrix.id }}
          path: mod/build/mod-index/
          if-no-files-found: error

  # Ein Artefakt mit mod-index.json und allen Jars; hier greift auch das Gesamtbudget.
  package:
    name: Package mod-index
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mod-node-*
          path: parts

      - name: Merge the node indexes
        run: |
          mkdir out
          cp parts/*/*.jar out/
          jq -s '{
            modVersion: (map(.modVersion) | unique | if length == 1 then .[0] else error("modVersion differs between nodes") end),
            nodes: (map(.nodes) | add | sort_by(.id))
          }' parts/*/mod-index.json > out/mod-index.json

      - name: Validate mod-index.json, hashes and size budget
        run: node mod/scripts/validate-mod-index.mjs out/mod-index.json out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-index
          path: out/
          if-no-files-found: error
