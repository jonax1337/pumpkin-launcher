name: Release

# Tag v* pushen → die Installer für Windows, Linux und macOS plus ein gemeinsames latest.json als Entwurf.
# Ablauf: CONTRIBUTING.md#release-packaging
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Check version & create draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error file=$1::$1 has version $2, but the tag is $GITHUB_REF_NAME. Bump all three files (see CONTRIBUTING.md#release-packaging)."
              status=1
            fi
          }
          check package.json "$(node -p "require('./package.json').version")"
          check src-tauri/tauri.conf.json "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check src-tauri/Cargo.toml "$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"
          exit $status

      # checkout legt den Tag ohne Nachricht an; die Nachricht des annotierten Tags sind die Versionshinweise.
      - name: Read release notes from tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "body<<RELEASE_NOTES"
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Ein Entwurf vorab für alle Plattformen: parallel angelegt entstünden sonst mehrere.
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Pumpkin Launcher $GITHUB_REF_NAME" -f body="$NOTES" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    # Signing uses repository or release-environment secrets; reviewer protection is not currently configured.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          # Universal-Build: eine App für Apple Silicon und Intel, im latest.json unter beiden Schlüsseln.
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signieren ist optional: Ohne die Secrets bleibt der Build wie bisher (Windows unsigniert, macOS ad-hoc signiert,
      # siehe CONTRIBUTING.md#signing). Die Schritte unten setzen ihre Variablen deshalb nur, wenn alles da ist: Ein leeres
      # APPLE_SIGNING_IDENTITY würde die Ad-hoc-Identität "-" aus tauri.conf.json überschreiben.
      - name: Detect configured code signing
        id: signing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          all_set() {
            local name
            for name in "$@"; do
              [ -n "${!name}" ] || return 1
            done
          }
          windows=false
          macos=false
          notarize=false
          if [ "$RUNNER_OS" = Windows ] && all_set AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_CERTIFICATE_PROFILE; then
            windows=true
          fi
          if [ "$RUNNER_OS" = macOS ] && all_set APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; then
            macos=true
            all_set APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID && notarize=true
          fi
          echo "Code signing: windows=$windows macos=$macos notarization=$notarize"
          {
            echo "windows=$windows"
            echo "macos=$macos"
            echo "notarize=$notarize"
          } >> "$GITHUB_OUTPUT"

      # Tauri importiert das Zertifikat selbst (APPLE_CERTIFICATE), signiert die Universal-App mit der Identität und
      # notarisiert sie, sobald APPLE_ID, APPLE_PASSWORD und APPLE_TEAM_ID gesetzt sind.
      - name: Enable macOS signing and notarization
        if: steps.signing.outputs.macos == 'true'
        shell: bash
        env:
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_env() {
            local delimiter="env_$(uuidgen)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "${!1}" "$delimiter" >> "$GITHUB_ENV"
          }
          export_env APPLE_CERTIFICATE
          export_env APPLE_CERTIFICATE_PASSWORD
          export_env APPLE_SIGNING_IDENTITY
          if [ "$NOTARIZE" = true ]; then
            export_env APPLE_ID
            export_env APPLE_PASSWORD
            export_env APPLE_TEAM_ID
          fi

      - name: Install the Azure Artifact Signing CLI
        if: steps.signing.outputs.windows == 'true'
        shell: bash
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      # Windows: Tauri ruft den Signaturbefehl für jede Datei auf, die es selbst erzeugt (Haupt-App, eigene NSIS-Plugins,
      # Deinstaller, Installer). Die Updater-Signatur (.sig) entsteht danach und deckt so die signierte Datei ab.
      - name: Configure Windows signing
        id: windows-signing
        if: steps.signing.outputs.windows == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -n 1)
          {
            echo "SIGNTOOL_PATH=$(cygpath -w "$signtool")"
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
          } >> "$GITHUB_ENV"
          # Nur für diesen Build per --config zugeschaltet: Ein fester signCommand in tauri.conf.json bräche jeden Build ohne die CLI.
          config="$RUNNER_TEMP/tauri-windows-signing.json"
          jq -n \
            --arg endpoint "$AZURE_SIGNING_ENDPOINT" \
            --arg account "$AZURE_SIGNING_ACCOUNT" \
            --arg profile "$AZURE_SIGNING_CERTIFICATE_PROFILE" \
            '{bundle: {windows: {signCommand: {cmd: "artifact-signing-cli", args: [
              "-e", $endpoint, "-a", $account, "-c", $profile, "-d", "Pumpkin Launcher",
              "--fd", "SHA256", "--tr", "http://timestamp.acs.microsoft.com", "--td", "SHA256", "%1"
            ]}}}}' > "$config"
          echo "config=$(cygpath -m "$config")" >> "$GITHUB_OUTPUT"

      # Das Theme-Plugin liegt als fertige DLL im Repo (installer/theme/); Tauri signiert nur die NSIS-Plugins, die es selbst kopiert.
      - name: Sign the installer theme plugin
        if: steps.signing.outputs.windows == 'true'
        shell: bash
        env:
          SIGNING_CONFIG: ${{ steps.windows-signing.outputs.config }}
        run: |
          plugin=$(cygpath -w "$PWD/src-tauri/installer/theme/PumpkinTheme.dll")
          command_lines=$(jq -r --arg file "$plugin" \
            '.bundle.windows.signCommand | [.cmd] + [.args[] | if . == "%1" then $file else . end] | .[]' "$SIGNING_CONFIG" | tr -d '\r')
          mapfile -t command <<< "$command_lines"
          "${command[@]}"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Der Entwurf hat den Text schon; tauri-action schreibt ihn als `notes` in latest.json, das der Updater anzeigt.
          releaseBody: ${{ needs.prepare.outputs.notes }}
          args: ${{ steps.windows-signing.outputs.config && format('{0} --config {1}', matrix.args, steps.windows-signing.outputs.config) || matrix.args }}

  # Die Builds ergänzen latest.json nacheinander; enden zwei gleichzeitig, kann eine Plattform fehlen.
  updater-json:
    name: Check latest.json
    needs: build
    runs-on: ubuntu-latest
    # Entwürfe sieht nur, wer Schreibrechte hat.
    permissions:
      contents: write
    steps:
      - name: latest.json lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          status=0
          for platform in windows-x86_64 linux-x86_64 darwin-x86_64 darwin-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms[$p]' latest.json > /dev/null; then
              echo "::error::latest.json has no entry for $platform. Re-run that platform's build job (see CONTRIBUTING.md#release-packaging)."
              status=1
            fi
          done
          exit $status

  # Die Website verlinkt feste Dateinamen unter .../releases/latest/download/; die Namen der Tauri-Installer tragen die Version.
  # Kopien unter festen Namen, noch im Entwurf, damit Prüfsummen und Herkunftsnachweis sie mit abdecken.
  # Kein Signaturschlüssel und nicht die Umgebung `release`: nur das eingebaute GITHUB_TOKEN.
  stable-names:
    name: Stable download names
    needs: updater-json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy the installers under their stable names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir stable
          status=0
          copy_as() {
            local pattern="$1" stable_name="$2"
            rm -rf source && mkdir source
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir source || true
            if [ "$(ls source | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one release file matching '$pattern' for $stable_name, found $(ls source | wc -l). Re-run that platform's build job (see CONTRIBUTING.md#release-packaging)."
              status=1
              return
            fi
            mv source/* "stable/$stable_name"
          }
          copy_as '*_x64-setup.exe' Pumpkin.Launcher_x64-setup.exe
          copy_as '*_universal.dmg' Pumpkin.Launcher_universal.dmg
          copy_as '*_amd64.AppImage' Pumpkin.Launcher_amd64.AppImage
          copy_as '*_amd64.deb' Pumpkin.Launcher_amd64.deb
          [ "$status" -eq 0 ] || exit 1
          ls -l stable
          gh release upload "$GITHUB_REF_NAME" stable/* --repo "$GITHUB_REPOSITORY" --clobber

  # Prüfsummen und Herkunftsnachweis erst, wenn alle Dateien im Entwurf liegen.
  checksums:
    name: SHA256SUMS & provenance
    needs: stable-names
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Create SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach SHA256SUMS to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
