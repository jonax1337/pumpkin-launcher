name: Release

# Tag v* pushen → zuerst die In-Game-Mod (alle Knoten aus mod/nodes.txt, wie mod.yml), dann die Installer für
# Windows, Linux und macOS, die die Mod-Jars über PUMPKIN_MOD_DIST einbetten, plus ein gemeinsames latest.json
# als Entwurf. Ablauf: docs/RELEASING.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Check version & create draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check tag matches app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error file=$1::$1 has version $2, but the tag is $GITHUB_REF_NAME. Bump all four files (see docs/RELEASING.md)."
              status=1
            fi
          }
          check package.json "$(node -p "require('./package.json').version")"
          check src-tauri/tauri.conf.json "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check src-tauri/Cargo.toml "$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"
          # Die Mod-Version ist immer die Launcher-Version (INGAME 3.2); modVersion und jeder Jar-Name tragen sie.
          check mod/gradle.properties "$(grep -m1 '^version=' mod/gradle.properties | cut -d= -f2)"
          exit $status

      # checkout legt den Tag ohne Nachricht an; die Nachricht des annotierten Tags sind die Versionshinweise.
      - name: Read release notes from tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "body<<RELEASE_NOTES"
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Ein Entwurf vorab für alle Plattformen: parallel angelegt entstünden sonst mehrere.
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Pumpkin Launcher $GITHUB_REF_NAME" -f body="$NOTES" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Die Mod-Jars für die Einbettung: derselbe Weg wie mod.yml (Knotenliste aus mod/nodes.txt, ein Job je Knoten,
  # Zusammenführen und Prüfen), hier ohne die CI-Gates (Schichtregeln, Compile-Matrix, Kit-Demo) — der Release-Tag
  # braucht nur die Jars, und der `build`-Task jedes Knotens kompiliert und testet sowieso.
  mod-nodes:
    name: Mod node list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # java = JDK des Spiels, gradleJava = JDK, auf dem Gradle läuft (Spalte gradleJdk), family = Cache-Familie.
      - name: Read nodes.txt
        id: matrix
        run: |
          matrix=$(jq -R -s -c '
            split("\n")
            | map(sub("#.*"; "") | gsub("^\\s+|\\s+$"; "") | select(length > 0) | gsub("\\s+"; " ") | split(" "))
            | map({
                id: .[0],
                loader: .[1],
                java: (.[4] | tonumber),
                gradleJava: (.[6] | tonumber),
                family: (if .[1] == "fabric" then "fabric" elif .[1] == "neoforge" then "neoforge" else "legacyforge" end)
              })' mod/nodes.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mod-build:
    name: Mod node ${{ matrix.id }}
    needs: mod-nodes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mod-nodes.outputs.matrix) }}
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Game JDK ${{ matrix.java }}
        id: game-jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Expose the game JDK to Gradle
        run: echo "PUMPKIN_JDK_${{ matrix.java }}=${{ steps.game-jdk.outputs.path }}" >> "$GITHUB_ENV"

      - name: Gradle JDK ${{ matrix.gradleJava }}
        if: matrix.gradleJava != matrix.java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.gradleJava }}

      # Ein Cache je Toolchain-Familie wie in mod.yml; auf einem Tag-Push bringt vor allem restore-keys etwas.
      - name: Gradle cache (${{ matrix.family }})
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mod/.gradle/loom-cache
          key: gradle-${{ matrix.family }}-${{ hashFiles('mod/gradle.properties', 'mod/gradle/wrapper/gradle-wrapper.properties', format('mod/build-{0}.gradle', matrix.loader)) }}
          restore-keys: |
            gradle-${{ matrix.family }}-

      - name: Build and test
        run: ./gradlew -Pnode=${{ matrix.id }} -Pcore.testJdk=${{ matrix.java }} build modIndex

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-node-${{ matrix.id }}
          path: mod/build/mod-index/
          if-no-files-found: error

  mod-package:
    name: Mod package
    needs: mod-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Der Job führt nur Node-Skripte aus; die pnpm-Cache-Erkennung des Lockfiles stirbt ohne installiertes pnpm.
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mod-node-*
          path: parts

      - name: Merge the node indexes
        run: |
          mkdir out
          cp parts/*/*.jar out/
          jq -s '{
            modVersion: (map(.modVersion) | unique | if length == 1 then .[0] else error("modVersion differs between nodes") end),
            nodes: (map(.nodes) | add | sort_by(.id))
          }' parts/*/mod-index.json > out/mod-index.json

      - name: Validate mod-index.json, hashes and size budget
        run: node mod/scripts/validate-mod-index.mjs out/mod-index.json out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-index
          path: out/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, mod-package]
    # Der Signaturschlüssel liegt als Secret dieser Umgebung; ihre Pflichtprüfer geben jeden Build frei (docs/RELEASING.md).
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --features beta-relays
          - platform: ubuntu-22.04
            args: --features beta-relays
          # Universal-Build: eine App für Apple Silicon und Intel, im latest.json unter beiden Schlüsseln.
          - platform: macos-latest
            args: --target universal-apple-darwin --features beta-relays
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Download the mod dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mod-index
          path: mod-dist

      # Einbettung ist Pflicht: Der Index muss gültig sein und die Version des Tags tragen (die Mod-Version ist
      # immer die Launcher-Version, INGAME 3.2), sonst steht später "in diesem Build nicht verfügbar" im Spiel.
      - name: Check the mod dist (index and version)
        shell: bash
        run: |
          node mod/scripts/validate-mod-index.mjs mod-dist/mod-index.json mod-dist
          index_version=$(jq -r .modVersion mod-dist/mod-index.json)
          if [ "$index_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::mod-index.json has modVersion $index_version, but the tag is $GITHUB_REF_NAME."
            exit 1
          fi
          echo "Embedding pumpkin_friends $index_version ($(ls mod-dist/*.jar | wc -l) jars)."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Öffentliche Adresse des Freunde-Verzeichnisses (siehe directory/README.md); kein Geheimnis. Forks lassen sie leer.
          PUMPKIN_FRIENDS_DIRECTORY: https://pumpkin-friends-directory.jonas-laux.workers.dev
          # Der Mod-Ordner (mod-index.json + Jars), den build.rs einbettet (INGAME 3.2); ohne ihn trägt der
          # Launcher keine Mod und die Einspeisung meldet "in diesem Build nicht verfügbar".
          PUMPKIN_MOD_DIST: ${{ github.workspace }}/mod-dist
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Der Entwurf hat den Text schon; tauri-action schreibt ihn als `notes` in latest.json, das der Updater anzeigt.
          releaseBody: ${{ needs.prepare.outputs.notes }}
          args: ${{ matrix.args }}

  # Die Builds ergänzen latest.json nacheinander; enden zwei gleichzeitig, kann eine Plattform fehlen.
  updater-json:
    name: Check latest.json
    needs: build
    runs-on: ubuntu-latest
    # Entwürfe sieht nur, wer Schreibrechte hat.
    permissions:
      contents: write
    steps:
      - name: latest.json lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          status=0
          for platform in windows-x86_64 linux-x86_64 darwin-x86_64 darwin-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms[$p]' latest.json > /dev/null; then
              echo "::error::latest.json has no entry for $platform. Re-run that platform's build job (see docs/RELEASING.md)."
              status=1
            fi
          done
          exit $status

  # Die Website verlinkt feste Dateinamen unter .../releases/latest/download/; die Namen der Tauri-Installer tragen die Version.
  # Kopien unter festen Namen, noch im Entwurf, damit Prüfsummen und Herkunftsnachweis sie mit abdecken.
  # Kein Signaturschlüssel und nicht die Umgebung `release`: nur das eingebaute GITHUB_TOKEN.
  stable-names:
    name: Stable download names
    needs: updater-json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy the installers under their stable names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir stable
          status=0
          copy_as() {
            local pattern="$1" stable_name="$2"
            rm -rf source && mkdir source
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir source || true
            if [ "$(ls source | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one release file matching '$pattern' for $stable_name, found $(ls source | wc -l). Re-run that platform's build job (see docs/RELEASING.md)."
              status=1
              return
            fi
            mv source/* "stable/$stable_name"
          }
          copy_as '*_x64-setup.exe' Pumpkin.Launcher_x64-setup.exe
          copy_as '*_universal.dmg' Pumpkin.Launcher_universal.dmg
          copy_as '*_amd64.AppImage' Pumpkin.Launcher_amd64.AppImage
          copy_as '*_amd64.deb' Pumpkin.Launcher_amd64.deb
          [ "$status" -eq 0 ] || exit 1
          ls -l stable
          gh release upload "$GITHUB_REF_NAME" stable/* --repo "$GITHUB_REPOSITORY" --clobber

  # Prüfsummen und Herkunftsnachweis erst, wenn alle Dateien im Entwurf liegen.
  checksums:
    name: SHA256SUMS & provenance
    needs: stable-names
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Create SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Attach SHA256SUMS to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
