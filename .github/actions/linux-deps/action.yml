name: Linux system libraries
description: Tauri-Voraussetzungen unter Linux (https://v2.tauri.app/start/prerequisites/#linux), patchelf für das AppImage

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
