[package]
name = "launcher"
version = "0.5.1"
description = "Pumpkin Launcher – Jede Welt. Ein Klick."
authors = ["LAUX DIGITAL"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png", "protocol-asset"] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util", "time", "net"] }
futures = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tauri-plugin-dialog = "2.8.1"
tokio-util = "0.7.19"
base64 = "0.23.1"
keyring-core = "1.0.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-deep-link = "2.6.1"
regex = "1.13.1"
fastnbt = "2.6.3"
flate2 = "1.1.10"
trash = "5.2.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
percent-encoding = "2.3.2"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
discord-rich-presence = "1.1.0"
data-encoding = "2.11.1"
getrandom = "0.4.3"
ring = "0.17.14"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
