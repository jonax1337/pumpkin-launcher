[package]
name = "launcher"
version = "0.1.0"
description = "Pumpkin Launcher – Jede Welt. Ein Klick."
authors = ["LAUX DIGITAL"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util", "time", "net"] }
futures = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11"
md-5 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tauri-plugin-dialog = "2"
tokio-util = "0.7.19"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
regex = "1.13.1"
fastnbt = "2.6.3"
flate2 = "1.1.10"
trash = "5.2.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7"
percent-encoding = "2.3.2"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
discord-rich-presence = "1.1.0"
iroh = "1.3"
data-encoding = "2"
unicode-normalization = "0.1"

[features]
# Zusätzlich die öffentlichen Relays von n0 (nur Entwicklung und geschlossene Beta, siehe docs/friends/SPEC.md 3.2).
beta-relays = []

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
iroh = { version = "1.3", features = ["test-utils"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
