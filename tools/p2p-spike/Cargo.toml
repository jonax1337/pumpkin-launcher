[package]
name = "p2p-spike"
version = "0.1.0"
description = "Wegwerf-Spike für Pumpkin Friends (R0b): misst iroh-Verbindungen zwischen zwei Rechnern."
edition = "2021"
publish = false

# Standalone crate: its own Cargo.lock and target/ (SPEC 14, R0b). Not part of CI.
[workspace]

[dependencies]
iroh = { version = "1.3", features = ["unstable-net-report"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
n0-future = "0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
iroh = { version = "1.3", features = ["unstable-net-report", "test-utils"] }
