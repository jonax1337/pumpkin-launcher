plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

apply from: rootProject.file('gradle/node.gradle')

// Tracer-Knoten: nur die Einstiegsklasse. compat/ und ui/ kommen mit den Paketen, die sie für diesen Knoten bauen.
sourceSets.main.java.exclude('dev/laux/pumpkin/friends/compat/**', 'dev/laux/pumpkin/friends/ui/**',
	'dev/laux/pumpkin/friends/platform/fabric/**', 'dev/laux/pumpkin/friends/platform/forge/**')

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"pumpkin_friends" {
			sourceSet sourceSets.main
			sourceSet project(':core').sourceSets.main
		}
	}
}

registerModIndexEntry(tasks.named('jar').flatMap { it.archiveFile })
