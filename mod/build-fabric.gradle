plugins {
	// Ohne Remapping: ab Minecraft 26.1 ist das Spiel nicht mehr verschleiert. Für ältere Fabric-Knoten kommt
	// dev.kikugie.loom-back-compat dazu (README, Abschnitt Versionen).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

apply from: rootProject.file('gradle/node.gradle')

// Andere Loader haben eigene Einstiegsklassen und sehen die Fabric-API nicht.
sourceSets.main.java.exclude('dev/laux/pumpkin/friends/platform/neoforge/**', 'dev/laux/pumpkin/friends/platform/forge/**')

dependencies {
	minecraft "com.mojang:minecraft:${sc.current.version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	mods {
		"pumpkin_friends" {
			sourceSet sourceSets.main
		}
	}
}

registerModIndexEntry(tasks.named('jar').flatMap { it.archiveFile })
