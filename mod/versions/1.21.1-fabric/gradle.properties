# Tracer-Knoten (INGAME 11.2, S1): beweist, dass ein remappter Fabric-Jar über -Dfabric.addMods lädt und sein Mixin greift.
tracer=true
# Minecraft 1.20.5 bis 1.21.1 laufen in Intermediary-Namen: Loom mit Remapping, das Jar des Knotens ist remapJar (INGAME A4).
loomx.unobfuscated=false
fabric_entrypoint=dev.laux.pumpkin.friends.platform.fabric.TracerClient
fabric_mixin_configs=pumpkin_friends.tracer.mixins.json

fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1

# Compile-Matrix (-Pcompile.minecraft=<Version>): für jede Version der matrix in nodes.txt, die nicht die Standardversion
# des Knotens ist, die Fabric-API-Version dieser Minecraft-Version (je die neueste im Fabric-Maven, 2026-10-04).
fabric_api_version@1.20.5=0.97.8+1.20.5
fabric_api_version@1.20.6=0.100.8+1.20.6
fabric_api_version@1.21=0.102.0+1.21
