modLoader = "javafml"
loaderVersion = "[1,)"
license = "Apache-2.0"
# Reine Client-Mod (docs/bridge/README.md): Forge überspringt das Jar auf einem dedizierten Server und wählt IGNORE_ALL_VERSION,
# sodass die Serverliste keine Versionsabweichung zeigt. IGNORE_SERVER_VERSION wäre die Konstante für Server-Mods.
clientSideOnly = true
issueTrackerURL = "https://github.com/jonax1337/pumpkin-launcher/issues"

[[mods]]
modId = "pumpkin_bridge"
version = "${version}"
displayName = "Pumpkin Bridge"
authors = "jonax1337"
description = '''
Connects Minecraft to the Pumpkin Launcher through Pumpkin Bridge, with Friends for sharing worlds and invitations. Does nothing without the launcher.
NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
'''
logoFile = "assets/pumpkin_bridge/icon.png"

[[dependencies.pumpkin_bridge]]
modId = "forge"
mandatory = true
versionRange = "[${loaderMin},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pumpkin_bridge]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "CLIENT"
