modLoader = "javafml"
loaderVersion = "[47,)"
license = "Apache-2.0"
# Reine Client-Mod (INGAME A3): Forge überspringt das Jar auf einem dedizierten Server und wählt IGNORE_ALL_VERSION,
# sodass die Serverliste keine Versionsabweichung zeigt. IGNORE_SERVER_VERSION wäre die Konstante für Server-Mods.
clientSideOnly = true
issueTrackerURL = "https://github.com/jonax1337/pumpkin-launcher/issues"

[[mods]]
modId = "pumpkin_friends"
version = "${version}"
displayName = "Pumpkin Friends"
authors = "jonax1337"
description = '''
Connects the game to the Pumpkin Launcher's Friends feature. Does nothing without the launcher.
NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.
'''
logoFile = "assets/pumpkin_friends/icon.png"

[[dependencies.pumpkin_friends]]
modId = "forge"
mandatory = true
versionRange = "[${loaderMin},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pumpkin_friends]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "CLIENT"
