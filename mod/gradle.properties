org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Plugin-Versionen geprüft gegen die Maven-Metadaten am 2026-10-03 (mod/README.md, Abschnitt Versionen).
# Loom (Fabric, ohne Remapping ab Minecraft 26.1) und ModDevGradle (NeoForge und Forge) gelten für alle Knoten.
loom_version=1.18.2
moddev_version=2.0.148

# Gson und SLF4J liefert das Spiel; core/ kompiliert nur dagegen. Die ältesten Stände, auf denen die Mod laufen soll
# (Minecraft 1.20.1 bringt Gson 2.10 und SLF4J 2.0), geben die Version vor.
gson_version=2.10.1
slf4j_version=2.0.17
junit_version=6.1.3

group=dev.laux.pumpkin
# Entspricht der Launcher-Version (INGAME 3.2); das Jar trägt zusätzlich "+<Knoten-Id>".
version=2.1.0

# JDK-Versionen je Knoten stehen in nodes.txt. Gradle selbst läuft mit mindestens diesem JDK (Stonecutter verlangt 21);
# das Spiel eines Knotens startet Gradle über die Toolchain mit dem JDK des Knotens. Die JDKs kommen aus den
# Umgebungsvariablen, die scripts/dev-env.* und der Workflow setzen; nichts wird nachgeladen.
mod.gradleJdkMin=21
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=PUMPKIN_JDK_17,PUMPKIN_JDK_21,PUMPKIN_JDK_25

# Größenbudget (INGAME 3.2): ein Jar höchstens 300 KB, alle Jars zusammen höchstens 8 MB. Gradle und CI lesen diese Werte.
mod.jarMaxBytes=307200
mod.totalMaxBytes=8388608

# Die Build-Skripte bleiben bewusst Groovy (wie bisher); das bestätigt die Stonecutter-Warnung.
dev.kikugie.stonecutter.hard_mode=true
