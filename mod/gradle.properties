org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Unimined 1.4.1 retains Gradle objects and runs setup processes during configuration.
org.gradle.configuration-cache=false

# Plugin- und Testversionen geprüft gegen die Maven-Metadaten am 2026-10-07 (mod/README.md, Abschnitt Versions).
# Loom (Fabric; loom-back-compat wählt je Knoten mit oder ohne Remapping) und ModDevGradle (NeoForge und Forge) gelten für alle Knoten.
loom_version=1.18.2
moddev_version=2.0.148
unimined_version=1.4.1

# Compile against the oldest game-supplied APIs (Minecraft 1.16.5); no logging implementation is bundled.
gson_version=2.8.0
log4j_version=2.8.1
junit_version=6.1.3

group=dev.laux.pumpkin.bridge
# Entspricht der Launcher-Version; das Jar trägt zusätzlich "+<Knoten-Id>".
version=0.5.0

# JDK-Versionen je Knoten stehen in nodes.txt. Gradle selbst läuft mit mindestens diesem JDK (Stonecutter verlangt 21);
# das Spiel eines Knotens startet Gradle über die Toolchain mit dem JDK des Knotens. Die JDKs kommen aus den
# Umgebungsvariablen, die scripts/dev-env.* und der Workflow setzen; nichts wird nachgeladen.
mod.gradleJdkMin=21
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=PUMPKIN_JDK_8,PUMPKIN_JDK_17,PUMPKIN_JDK_21,PUMPKIN_JDK_25

# Full Java-8-compatible UI and 102 release/loader artifacts: bounded per-JAR and aggregate budgets.
mod.jarMaxBytes=327680
mod.totalMaxBytes=33554432

# Die Build-Skripte bleiben bewusst Groovy (wie bisher); das bestätigt die Stonecutter-Warnung.
dev.kikugie.stonecutter.hard_mode=true
