plugins {
	id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"
}

ext.mixin_refmap = '"pumpkin_bridge-refmap.json"'
apply from: rootProject.file('gradle/node.gradle')

sourceSets.main.java.exclude('dev/laux/pumpkin/bridge/platform/fabric/**',
	'dev/laux/pumpkin/bridge/platform/neoforge/**', 'dev/laux/pumpkin/bridge/platform/neoforgelegacy/**')

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

mixin {
	add sourceSets.main, 'pumpkin_bridge-refmap.json'
	config 'pumpkin_bridge.mixins.json'
}

tasks.named('jar') {
	manifest.attributes('MixinConfigs': 'pumpkin_bridge.mixins.json')
}

legacyForge {
	version = pinned('forge_version')

	runs {
		client {
			client()
			if (project.hasProperty('kitdemo')) {
				systemProperty 'pumpkin.dev.kitdemo', 'true'
			}
			if (project.hasProperty('demoHold')) {
				systemProperty 'pumpkin.dev.demoHold', 'true'
			}
		}
	}

	mods {
		"pumpkin_bridge" {
			sourceSet sourceSets.main
			sourceSet project(':core').sourceSets.main
		}
	}
}

// reobfJar bildet das Jar auf die Namen ab, die Forge in der Produktion kennt; erst das ist das Jar des Knotens.
registerModIndexEntry(tasks.named('reobfJar').flatMap { it.archiveFile })
