<meta charset="utf-8">
<title>Pumpkin Launcher Pixelkino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Jersey+10&display=block">
<style>
/* PIXELKINO 2
   Layout: rahmenlose Fensterleiste oben (Wortzeichen, drei Pixel-Tabs, Aufgaben, Spieler, Fensterknöpfe), darunter eine Ansicht.
   Die Szene ist die einzige laute Stelle. Alles andere ist flach, ruhig und folgt einem einzigen Pixelraster: --px.
   --px ist ein Welt-Pixel. JS setzt es so, dass es immer eine ganze Zahl Gerätepixel trifft (100 %, 125 %, 150 %).
   Alles Pixelige (Kerben, Bevel, Rahmen, Fokusring, Fortschrittssegmente, Icon-Pixel, Szenenpixel) ist ein Vielfaches davon.
   Maße, die das Layout tragen (Höhen, Abstände), sind feste CSS-Pixel und hängen nie von --px ab: Pixelgröße umschalten verschiebt nichts. */
:root {
  color-scheme: dark;
  /* Pixeleinheit (wird per JS überschrieben) */
  --px: 3px;
  --u2: calc(var(--px) * 2);
  --u3: calc(var(--px) * 3);

  /* Flächen: Blauschwarz, flach, ohne Raster */
  --bg: #070A11;
  --bg-2: #0A0E17;
  --panel: #0F1521;
  --panel-2: #151D2C;
  --panel-3: #1D2739;
  --sunk: #0B1019;
  --line: #232E42;
  --line-2: #33415C;
  --edge: #03050A;
  --hi: rgba(255,255,255,.14);
  --hi-2: rgba(255,255,255,.06);
  --lo: rgba(0,0,0,.45);
  --scrim: rgba(7,10,17,.86);

  /* Text */
  --fg: #EBF0F8;
  --fg-2: #A9B4C8;
  --fg-3: #8491A8;

  /* Marke und Akzent: Kupfer global, pro Instanz eigener Akzent in --acc */
  --copper: #E39860;
  --acc: var(--copper);
  --acc-hi: color-mix(in srgb, var(--acc) 58%, #fff);
  --acc-lo: color-mix(in srgb, var(--acc) 50%, #1a0e05);
  --acc-mid: color-mix(in srgb, var(--acc) 78%, #2a1606);
  --acc-soft: color-mix(in srgb, var(--acc) 14%, transparent);
  --ink: #120C07;

  /* Status (ohne Grün) */
  --run: #8CC8F0;
  --warn: #F2C14E;
  --bad: #FF8A73;
  --bad-fill: #C9483A;
  --focus: #F6E7C8;

  /* Tooltip wie ein Item-Tooltip */
  --tip-bg: #0C0A18;
  --tip-a: #54409A;
  --tip-b: #2A2156;

  /* Schrift */
  --f-display: "Big Shoulders Display", "Arial Narrow", "Bahnschrift Condensed", sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-px: "Jersey 10", "Consolas", monospace;
  --f-mono: "Cascadia Mono", ui-monospace, Consolas, monospace;

  /* Höhen (fest, unabhängig von --px) */
  --h-s: 32px; --h-m: 40px; --h-l: 56px;
  --bar: 48px;
  --gut: clamp(16px, calc(var(--vw1, 1vw) * 2.6), 40px);
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* Kerben: 1 Stufe (klein), 2 Stufen (große Flächen), Fokusring (1 Einheit, 1 Einheit Abstand) */
  --n1: polygon(0 var(--px), var(--px) var(--px), var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px), 100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)));
  --n2: polygon(0 var(--u2), var(--px) var(--u2), var(--px) var(--px), var(--u2) var(--px), var(--u2) 0, calc(100% - var(--u2)) 0, calc(100% - var(--u2)) var(--px), calc(100% - var(--px)) var(--px), calc(100% - var(--px)) var(--u2), 100% var(--u2), 100% calc(100% - var(--u2)), calc(100% - var(--px)) calc(100% - var(--u2)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--u2)) calc(100% - var(--px)), calc(100% - var(--u2)) 100%, var(--u2) 100%, var(--u2) calc(100% - var(--px)), var(--px) calc(100% - var(--px)), var(--px) calc(100% - var(--u2)), 0 calc(100% - var(--u2)));
  --ring: polygon(evenodd, 0 var(--px), var(--px) var(--px), var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px), 100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%, var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px), var(--px) calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) var(--px), var(--px) var(--px), 0 var(--px));

  /* Bevel: Licht oben links, Schatten unten rechts, je 1 Einheit, innerhalb eines 1-Einheit-Rahmens */
  --bv-plate: inset 0 0 0 var(--px) var(--line), inset var(--u2) var(--u2) 0 var(--hi-2), inset calc(var(--u2) * -1) calc(var(--u2) * -1) 0 var(--lo);
  --bv-raised: inset 0 0 0 var(--px) var(--line-2), inset var(--u2) var(--u2) 0 var(--hi), inset calc(var(--u2) * -1) calc(var(--u2) * -1) 0 var(--lo);
  --bv-sunk: inset 0 0 0 var(--px) var(--line), inset var(--u2) var(--u2) 0 var(--lo), inset calc(var(--u2) * -1) calc(var(--u2) * -1) 0 var(--hi-2);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; border-radius: 0; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg, canvas { display: block; }
a { color: inherit; }
:focus { outline: none; }
::selection { background: var(--copper); color: var(--ink); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, .pxn { font-family: var(--f-px); font-weight: 400; letter-spacing: .02em; }

/* Pixel-Scrollbalken */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--bg); box-shadow: inset var(--px) 0 0 var(--edge); }
::-webkit-scrollbar-thumb { background: var(--panel-3); box-shadow: inset 0 0 0 var(--px) var(--edge), inset var(--u2) var(--u2) 0 var(--hi), inset calc(var(--u2) * -1) calc(var(--u2) * -1) 0 var(--lo); }
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }
::-webkit-scrollbar-corner { background: var(--bg); }

/* ---------- Fokusring: gestuft, 1 Einheit breit, 1 Einheit Abstand ---------- */
.fx { position: relative; }
.fx:focus-visible::after, .fxw:focus-within::after { content: ""; position: absolute; inset: calc(var(--u2) * -1); background: var(--focus); clip-path: var(--ring); pointer-events: none; z-index: 5; }

/* ---------- App-Gerüst ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--bar) 1fr; background: var(--bg); opacity: 0; transition: opacity .4s var(--ease); }
#app.ready { opacity: 1; }
#view { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; overscroll-behavior: contain; min-height: 0; }
#view.noscroll { overflow-y: hidden; }

/* ---------- Fensterleiste ---------- */
.bar { position: relative; z-index: 40; display: flex; align-items: center; gap: 4px; height: var(--bar); padding-left: 12px; background: var(--bg-2); box-shadow: inset 0 calc(var(--px) * -1) 0 var(--edge); -webkit-app-region: drag; user-select: none; }
.bar button, .bar a, .bar .mockpill { -webkit-app-region: no-drag; }
.wm { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px 0 6px; text-decoration: none; color: var(--fg); flex: none; }
.wm .mark { width: 28px; height: 28px; display: grid; place-items: center; }
.wm .word { font: 400 26px/1 var(--f-px); letter-spacing: .14em; padding-top: 2px; }
.navtabs { display: flex; gap: 4px; margin-left: 8px; flex: none; }
.ptab { position: relative; isolation: isolate; height: 36px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; color: var(--fg-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.ptab::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: var(--n1); background: transparent; }
.ptab:hover { color: var(--fg); }
.ptab:hover::before { background: var(--panel); }
.ptab[aria-selected="true"] { color: var(--fg); }
.ptab[aria-selected="true"]::before { background: var(--panel-2); box-shadow: var(--bv-raised); }
.ptab[aria-selected="true"] .tick { opacity: 1; }
.ptab .tick { position: absolute; left: var(--u3); right: var(--u3); bottom: var(--u2); height: var(--px); background: var(--acc-bar, var(--copper)); opacity: 0; }
.bar-mid { flex: 1; min-width: 12px; display: flex; justify-content: center; }
.bar-right { position: relative; display: flex; align-items: center; gap: 4px; flex: none; }
.netchip { position: absolute; right: calc(100% + 8px); top: 50%; translate: 0 -50%; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; color: var(--warn); font-weight: 600; font-size: 12.5px; white-space: nowrap; opacity: 0; transition: opacity .2s var(--ease); pointer-events: none; isolation: isolate; }
.netchip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--warn) 12%, var(--bg-2)); box-shadow: inset 0 0 0 var(--px) color-mix(in srgb, var(--warn) 40%, transparent); clip-path: var(--n1); }
#app[data-offline] .netchip { opacity: 1; }
.barbtn { position: relative; isolation: isolate; height: 36px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; color: var(--fg-2); }
.barbtn::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: var(--n1); }
.barbtn:hover, .barbtn[aria-expanded="true"] { color: var(--fg); }
.barbtn:hover::before, .barbtn[aria-expanded="true"]::before { background: var(--panel-2); box-shadow: var(--bv-plate); }
.tasksbtn { width: 48px; }
.tasksbtn .tmini { position: absolute; left: 10px; right: 10px; bottom: 5px; height: var(--px); opacity: 0; }
.tasksbtn.busy .tmini { opacity: 1; }
.tasksbtn .badge { position: absolute; right: 3px; top: 3px; min-width: 16px; height: 16px; padding: 0 3px; display: grid; place-items: center; background: var(--copper); color: var(--ink); font: 400 15px/1 var(--f-px); clip-path: var(--n1); opacity: 0; }
.tasksbtn.busy .badge { opacity: 1; }
.mebtn { padding: 0 10px 0 4px; }
.mebtn .who { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--fg); }
.avatar { width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
.win { display: flex; height: var(--bar); margin-left: 4px; }
.winbtn { width: 46px; height: var(--bar); display: grid; place-items: center; color: var(--fg-2); }
.winbtn:hover { background: var(--panel-2); color: var(--fg); }
.winbtn.close:hover { background: var(--bad-fill); color: #fff; }
.mockpill { height: 26px; padding: 0 10px; border: 1px dashed #56627A; color: #9AA5B8; font: 500 11.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; background: transparent; }
.mockpill:hover { color: var(--fg); border-color: var(--fg-2); }

/* ---------- Pixel-Icons ---------- */
.pi { width: 28px; height: 28px; display: inline-grid; place-items: center; flex: none; }
.pi svg { width: calc(var(--px) * 7); height: calc(var(--px) * 7); shape-rendering: crispEdges; fill: currentColor; }
.pi.s { width: 20px; height: 20px; }
.pi.s svg { width: calc(var(--px) * 5); height: calc(var(--px) * 5); }
.gl { image-rendering: pixelated; shape-rendering: crispEdges; }
.mi { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.mi svg { width: calc(var(--px) * 10); height: calc(var(--px) * 10); }
.mi.l { width: 64px; height: 64px; }
.mi.l svg { width: calc(var(--px) * 16); height: calc(var(--px) * 16); }

/* ---------- Knöpfe ---------- */
.btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--h-m); padding: 0 16px; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--fg); flex: none; user-select: none; }
.btn.s { height: var(--h-s); padding: 0 12px; font-size: 13px; gap: 6px; }
.btn.l { height: var(--h-l); padding: 0 22px; font-size: 16px; }
.btn .bc { position: relative; display: inline-flex; align-items: center; gap: inherit; }
/* Sekundär: dunkle Platte mit Rahmen */
.btn-s::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--panel-2); box-shadow: var(--bv-raised); clip-path: var(--n1); }
.btn-s:hover::before { background: var(--panel-3); }
.btn-s:active:not(:disabled)::before { box-shadow: var(--bv-sunk); background: var(--panel); }
.btn-s:active:not(:disabled) .bc { transform: translateY(var(--px)); }
/* Primär: gefüllter Block. Sockel (::before) + Fläche (.bf). Hover hebt die Fläche um 1 Einheit, gedrückt sinkt sie und das Bevel kehrt sich um. */
.btn-p { color: var(--ink); }
.btn-p::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--acc-lo); clip-path: var(--n1); }
.btn-p .bf { position: absolute; inset: 0 0 var(--px) 0; z-index: -1; background: var(--acc); clip-path: var(--n1); box-shadow: inset var(--px) var(--px) 0 var(--acc-hi), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--acc-mid); }
.btn-p .bc { transform: translateY(calc(var(--px) * -.5)); }
.btn-p:hover:not(:disabled) .bf, .btn-p:hover:not(:disabled) .bc { transform: translateY(calc(var(--px) * -1)); }
.btn-p:hover:not(:disabled) .bc { transform: translateY(calc(var(--px) * -1.5)); }
.btn-p:active:not(:disabled) .bf { transform: translateY(var(--px)); box-shadow: inset var(--px) var(--px) 0 var(--acc-mid), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 var(--acc-hi); }
.btn-p:active:not(:disabled) .bc { transform: translateY(calc(var(--px) * .5)); }
/* Gefahr */
.btn-d { color: #fff; --acc: var(--bad-fill); --acc-hi: #E77466; --acc-mid: #A93A2E; --acc-lo: #6E2119; }
/* Geister-Knopf: nur Text, Pixel-Unterstrich beim Hover */
.btn-g { padding: 0 8px; color: var(--fg-2); }
.btn-g::before { content: ""; position: absolute; left: 8px; right: 8px; bottom: 7px; height: var(--px); background: currentColor; opacity: 0; z-index: -1; }
.btn-g:hover { color: var(--fg); }
.btn-g:hover::before { opacity: 1; }
.btn-g:active .bc { transform: translateY(var(--px)); }
.btn-g.warn { color: var(--warn); }
.btn-g.bad { color: var(--bad); }
.btn-g.acc { color: var(--acc-hi); }
/* Deaktiviert: flach, ohne Bevel */
.btn:disabled, .btn[aria-disabled="true"] { color: var(--fg-3); }
.btn-s:disabled::before, .btn-p:disabled::before, .btn-p[aria-disabled="true"]::before { background: var(--panel); box-shadow: inset 0 0 0 var(--px) var(--line); }
.btn-p:disabled .bf, .btn-p[aria-disabled="true"] .bf { opacity: 0; }
.btn-p:disabled .bc, .btn-p[aria-disabled="true"] .bc { transform: none; }
/* Symbolknopf */
.ib { width: var(--h-m); padding: 0; }
.ib.s { width: var(--h-s); padding: 0; }
.btn .count { font: 400 18px/1 var(--f-px); }

/* ---------- Chips ---------- */
.chip { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.chip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--chip-bg, rgba(10,14,23,.78)); box-shadow: inset 0 0 0 var(--px) var(--chip-line, var(--line)); clip-path: var(--n1); }
.chip b { font: 400 18px/1 var(--f-px); color: var(--fg); font-weight: 400; }
.chip.acc { color: var(--acc-hi); --chip-line: color-mix(in srgb, var(--acc) 45%, transparent); }
.chip.warn { color: var(--warn); --chip-line: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip.bad { color: var(--bad); --chip-line: color-mix(in srgb, var(--bad) 45%, transparent); }
.chip.run { color: var(--run); --chip-line: color-mix(in srgb, var(--run) 45%, transparent); }
.chip.s { height: 22px; padding: 0 7px; font-size: 11.5px; }
.sq { width: var(--u2); height: var(--u2); background: currentColor; flex: none; }

/* ---------- Eingaben ---------- */
.field { position: relative; isolation: isolate; display: flex; align-items: center; gap: 6px; height: var(--h-m); padding: 0 10px; color: var(--fg-3); }
.field::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--sunk); box-shadow: var(--bv-sunk); clip-path: var(--n1); }
.field:focus-within::before { box-shadow: inset 0 0 0 var(--px) var(--line-2), inset var(--u2) var(--u2) 0 var(--lo); }
.field input, .field select, .field textarea { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; color: var(--fg); outline: none; }
.field input::placeholder, .field textarea::placeholder { color: var(--fg-3); }
.field.s { height: var(--h-s); }
.field .clear { visibility: hidden; }
.field.has .clear { visibility: visible; }
.field.area { height: auto; padding: 10px; align-items: stretch; }
.field.area textarea { resize: none; font: 13px/1.5 var(--f-mono); min-height: 84px; }
.sel { position: relative; isolation: isolate; display: inline-flex; align-items: center; height: var(--h-m); color: var(--fg); }
.sel.s { height: var(--h-s); }
.sel::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--panel-2); box-shadow: var(--bv-raised); clip-path: var(--n1); pointer-events: none; }
.sel:hover::before { background: var(--panel-3); }
.sel select { appearance: none; -webkit-appearance: none; height: 100%; padding: 0 34px 0 12px; background: transparent; border: 0; color: var(--fg); font-weight: 600; font-size: 13px; cursor: pointer; }
.sel select option { background: var(--panel); color: var(--fg); }
.sel .pi { position: absolute; right: 6px; top: 50%; translate: 0 -50%; pointer-events: none; color: var(--fg-2); width: 22px; }
.sel .lab { padding-left: 12px; color: var(--fg-3); font-size: 12.5px; white-space: nowrap; }
.sel .lab + select { padding-left: 6px; }
.sel:focus-within::after { content: ""; position: absolute; inset: calc(var(--u2) * -1); background: var(--focus); clip-path: var(--ring); pointer-events: none; }

/* Pixel-Checkbox */
.cb { position: relative; width: 20px; height: 20px; display: inline-grid; place-items: center; flex: none; cursor: pointer; }
.cb input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.cb .box { position: absolute; inset: 0; background: var(--sunk); box-shadow: var(--bv-sunk); clip-path: var(--n1); pointer-events: none; }
.cb svg { position: relative; width: calc(var(--px) * 5); height: calc(var(--px) * 5); fill: var(--ink); shape-rendering: crispEdges; opacity: 0; pointer-events: none; }
.cb input:checked ~ .box { background: var(--copper); box-shadow: inset var(--px) var(--px) 0 #F5BE8E, inset calc(var(--px) * -1) calc(var(--px) * -1) 0 #B06C3C; }
.cb input:checked ~ svg { opacity: 1; }
.cb input:indeterminate ~ .box { background: var(--copper); box-shadow: none; }
.cb input:indeterminate ~ .dash { opacity: 1; }
.cb .dash { position: absolute; left: 5px; right: 5px; top: calc(50% - var(--px) / 2); height: var(--px); background: var(--ink); opacity: 0; }
.cb input:focus-visible ~ .ring { position: absolute; inset: calc(var(--u2) * -1); background: var(--focus); clip-path: var(--ring); }
.cb:hover .box { box-shadow: inset 0 0 0 var(--px) var(--line-2), inset var(--u2) var(--u2) 0 var(--lo); }

/* Pixel-Schalter */
.sw { position: relative; width: 40px; height: 22px; flex: none; display: inline-block; cursor: pointer; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 2; }
.sw .tr { position: absolute; inset: 0; background: var(--sunk); box-shadow: var(--bv-sunk); clip-path: var(--n1); }
.sw .kn { position: absolute; left: var(--u2); top: var(--u2); width: calc(22px - var(--px) * 4); height: calc(22px - var(--px) * 4); background: #8C97AD; box-shadow: inset var(--px) var(--px) 0 #C5CEDC, inset calc(var(--px) * -1) calc(var(--px) * -1) 0 #5C667B; transition: transform .12s steps(3); }
.sw input:checked ~ .tr { background: color-mix(in srgb, var(--copper) 35%, var(--sunk)); }
.sw input:checked ~ .kn { transform: translateX(18px); background: var(--copper); box-shadow: inset var(--px) var(--px) 0 #F5BE8E, inset calc(var(--px) * -1) calc(var(--px) * -1) 0 #B06C3C; }
.sw input:focus-visible ~ .ring { position: absolute; inset: calc(var(--u2) * -1); background: var(--focus); clip-path: var(--ring); pointer-events: none; }

/* Bild zusammensetzen: Grund, Wolkenband, Ebenen mit ganzzahligem Versatz, Effekte. k = Takt (12 pro Sekunde). */

}

/* Toasts: feste Höhe, gestapelt per transform */
const TOASTS = [];
function toast(msg, o = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + (o.kind || ''); el.setAttribute('role', 'status');
  el.innerHTML = `${ic(o.icon || (o.kind === 'bad' ? 'warn' : o.kind === 'warn' ? 'warn' : 'check'))}<span class="tmsg">${esc(msg)}</span>${o.act ? `<button class="btn btn-g s fx acc" data-t="act"><span class="bc">${esc(o.act)}</span></button>` : ''}<button class="btn btn-g ib s fx" data-t="x" aria-label="Schließen"><span class="bc">${ics('x5')}</span></button>`;
  $('#toasts').appendChild(el); TOASTS.unshift(el);
  const kill = () => { const k = TOASTS.indexOf(el); if (k > -1) TOASTS.splice(k, 1); el.classList.remove('in'); el.style.opacity = '0'; setTimeout(() => el.remove(), 300); stackToasts(); };
  el.addEventListener('click', ev => { const b = ev.target.closest('[data-t]'); if (!b) return; if (b.dataset.t === 'act' && o.fn) o.fn(); kill(); });

}

function discList() {
  const d = S.disc, q = d.q.trim().toLowerCase();
  let l = CAT.filter(c => c.kind === d.cat && (d.page > 1 || !c.more) && (!q || c.n.toLowerCase().includes(q) || c.d.toLowerCase().includes(q))
    && (d.ver === 'all' || c.mc.includes(d.ver)) && (d.loader === 'all' || c.L.includes(d.loader) || c.kind === 'pack' || (c.kind === 'shader' && ['Fabric', 'Quilt', 'NeoForge'].includes(d.loader))) && (d.catg === 'all' || c.cat === d.catg));
  if (d.sort === 'dl') l = l.sort((a, b) => b.dl - a.dl);
  if (d.sort === 'name') l = l.sort((a, b) => a.n.localeCompare(b.n, 'de'));
  return l;
}

}
function accRows() {
  return S.accounts.map(a => `<div class="acct ${a.active ? 'on' : ''}"><span class="avatar">${faceSVG(a.name)}</span><div class="an"><b>${esc(a.name)}</b><span>${a.kind === 'ms' ? 'Microsoft-Konto' : 'Spielername, nur Einzelspieler und LAN'}${a.active ? ' · aktiv' : ''}</span></div>${a.active ? '' : `<button class="btn btn-s s fx" data-act="accswitch" data-a="${a.id}"><span class="bc">Wechseln</span></button>`}<button class="btn btn-g s fx" data-act="accrm" data-a="${a.id}"><span class="bc">${a.kind === 'ms' ? 'Abmelden' : 'Entfernen'}</span></button></div>`).join('');
}
function updBox() {
  const u = S.settings.upd;
  if (u === 'check') return `<span class="prog ind" style="width:120px"></span><span class="muted">Suche nach Updates</span>`;

  if (u === 'dl') return `<span class="prog" style="width:220px;--p:${S.settings.updP || 0}"></span><span class="muted">Lade Update <span class="num" style="font-size:18px">${Math.floor((S.settings.updP || 0) * 100)} %</span></span>`;
  if (u === 'ready') return `<button class="btn btn-p fx" data-act="restart" style="width:220px"><span class="bf"></span><span class="bc">${ic('redo')}Jetzt neu starten</span></button><span class="muted">Update ist bereit. Laufende Spiele bleiben offen.</span>`;
  return `<button class="btn btn-s fx" data-act="updcheck" style="width:220px"><span class="bc">${ic('redo')}Nach Updates suchen</span></button><span class="muted">Pumpkin Launcher ist aktuell.</span>`;

<script>
/* =====================================================================
   Aufgaben (Downloads)
   ===================================================================== */
let TASKS = [
  { id: 't-sodium', label: 'Sodium installieren', sub: 'PvP Training', pct: 34, rate: 1.1, state: 'run', done() { addItem('pvp', catItem('sodium')); }, open() { openDetail('pvp'); } },
  { id: 't-cobble', label: 'Modpack „Cobblemon“ herunterladen', sub: 'Neue Instanz', pct: 12, rate: .45, state: 'run', packId: 'cobble', done() { finishPack('cobble'); }, open() { const i = INST.find(x => x.pack === 'cobble'); if (i) openDetail(i.id); } },
  { id: 't-fresh', label: 'Fresh Animations aktualisiert', sub: 'Survival 1.21 · vor 4 Minuten', pct: 100, state: 'done', open() { openDetail('survival'); } },
];
function addTask(t) { TASKS.unshift(Object.assign({ state: 'run', pct: 0, rate: 2 }, t)); paintTasks(true); return TASKS[0]; }
function taskSub(t) {
  if (t.state === 'run' && S.offline && !t.local) return 'Wartet auf Verbindung';
  if (t.id === 't-cobble' && t.state === 'run') return `${fmt(Math.round(t.pct / 100 * 1208))} von ${fmt(1208)} Dateien`;
  return t.sub;
}
function paintTasks(full) {
  const run = TASKS.filter(t => t.state === 'run');
  const b = $('#tasksBtn'); b.classList.toggle('busy', run.length > 0);
  $('#taskCount').textContent = run.length;
  $('#taskMini').style.setProperty('--p', run.length ? run.reduce((s, t) => s + t.pct, 0) / run.length / 100 : 0);
  b.setAttribute('aria-label', run.length ? `Aufgaben, ${run.length} laufen` : 'Aufgaben');
  const pop = $('#popTasks');
  if (full || !pop._built) {
    pop._built = 1;
    pop.innerHTML = `<div class="tasks-h"><b>Aufgaben</b><button class="btn btn-g s fx" data-act="tclear" ${TASKS.some(t => t.state !== 'run') ? '' : 'disabled'}><span class="bc">Fertige entfernen</span></button></div>`
      + (TASKS.length ? TASKS.map(t => `<div class="task ${t.state === 'run' ? '' : t.state}" data-task="${t.id}"><span class="ti">${ic(t.state === 'done' ? 'check' : t.state === 'fail' ? 'warn' : 'dl')}</span><div class="tt"><b>${esc(t.label)}</b>${t.state === 'run' ? `<span class="prog thin" style="--p:${t.pct / 100}"></span>` : ''}<span data-tsub>${esc(taskSub(t))}</span></div><span class="tp num" data-tp>${Math.floor(t.pct)} %</span><button class="btn btn-g ib s fx tx" data-act="tcancel" data-t="${t.id}" aria-label="${esc(t.label)} abbrechen" data-tip="Abbrechen"><span class="bc">${ics('x5')}</span></button><div class="tact">${t.state === 'done' ? `<button class="btn btn-s s fx" data-act="topen" data-t="${t.id}"><span class="bc">Öffnen</span></button>` : `<button class="btn btn-s s fx" data-act="tretry" data-t="${t.id}"><span class="bc">Erneut</span></button>`}</div></div>`).join('')
        : `<div class="none">Keine Aufgaben. Downloads und Installationen erscheinen hier.</div>`);
    return;
  }
  TASKS.forEach(t => { const el = $(`[data-task="${t.id}"]`, pop); if (!el) return; const p = $('.prog', el); if (p) p.style.setProperty('--p', t.pct / 100); $('[data-tp]', el).textContent = Math.floor(t.pct) + ' %'; $('[data-tsub]', el).textContent = taskSub(t); });
}
setInterval(() => {
  let changed = false;
  TASKS.forEach(t => {
    if (t.state !== 'run' || t.manual) return;
    if (S.offline && !t.local) return;
    t.pct = Math.min(100, t.pct + t.rate);
    if (t.pct >= 100) { t.state = 'done'; t.label = t.doneLabel || t.label.replace('installieren', 'installiert').replace('herunterladen', 'heruntergeladen'); changed = true; if (t.done) t.done(); }
  });
  paintTasks(changed);
}, 500);

/* =====================================================================
   Spielen: Vorbereiten -> Startet -> Läuft; Abbrechen, Fehler, Absturz
   ===================================================================== */
let gameTimer = 0, runTimer = 0, logTimer = 0;
const STEPS = [[8, 'Java wird geprüft'], [72, 'Lade Spieldateien'], [86, 'Loader wird eingerichtet'], [100, 'Lade Mods']];
function startPlay(id) {
  const i = inst(id), g = S.game;
  if (g.id === id && g.phase === 'run') { stopGame(); return; }
  if (g.id && g.id !== id && ['prep', 'start', 'run'].includes(g.phase)) return;
  if (g.id === id && ['prep', 'start'].includes(g.phase)) return;
  if (S.offline && !i.installed) return;
  if (i.preparing != null) return;
  Object.assign(g, { id, phase: 'prep', pct: 0, step: STEPS[0][1], done: 0, total: 0, err: '' });
  const task = addTask({ id: 't-play-' + id + Date.now(), label: `${i.name} vorbereiten`, sub: 'Spieldateien', manual: true, local: true });
  g.task = task;
  clearInterval(gameTimer);
  const speed = i.installed ? 2.1 : 1.3;
  gameTimer = setInterval(() => {
    if (S.offline && !i.installed) { failPlay('Download unterbrochen'); return; }
    g.pct = Math.min(100, g.pct + (S.offline ? 6 : speed));
    const st = STEPS.find(s => g.pct <= s[0]) || STEPS[3];
    g.step = st[1] === 'Loader wird eingerichtet' ? (i.loader === 'Vanilla' ? 'Spiel wird eingerichtet' : `${i.loader} wird eingerichtet`) : st[1];
    if (st[1] === 'Lade Spieldateien') { g.total = 3480; g.done = Math.round(clamp((g.pct - 8) / 64, 0, 1) * 3480); } else if (st[1] === 'Lade Mods') { g.total = liveItems(id).length; g.done = Math.round(clamp((g.pct - 86) / 14, 0, 1) * g.total); } else { g.total = 0; }
    task.pct = g.pct; task.sub = g.step;
    if (g.pct >= 100) { clearInterval(gameTimer); task.state = 'done'; task.label = `${i.name} vorbereitet`; task.sub = 'Bereit zum Spielen'; task.open = () => openDetail(id); paintTasks(true); i.installed = true; beginStart(i); return; }
    paintPlays(); paintTasks(false);
  }, 110);
  paintPlays(); paintTasks(true);
}
function beginStart(i) {
  const g = S.game; g.phase = 'start'; paintPlays(); updateLiveBits();
  clearTimeout(runTimer);
  runTimer = setTimeout(() => {
    g.phase = 'run'; g.t0 = Date.now();
    const log = baseLog(i); log.length = 0; i.last = 'gerade eben';
    pushLog(i, 'INFO', 'main', `Pumpkin Launcher startet die Instanz „${i.name}“ (Java 21.0.5, ${i.ram === 'auto' ? '4' : i.ram} GB)`);
    paintPlays(); updateLiveBits();
    let n = 0;
    const script = [['INFO', 'main', i.loader === 'Vanilla' ? `Loading Minecraft ${i.mc}` : `Loading Minecraft ${i.mc} with ${i.loader} Loader ${LV[i.loader]}`], ['INFO', 'main', `Loading ${liveItems(i.id).length} mods`], ['WARN', 'main', "Mod 'mod-menu' hat ein Update"], ['INFO', 'main', 'Setting user: ' + activeAcc().name], ['INFO', 'Render thread', 'OpenGL 4.6 (NVIDIA GeForce RTX 3070)'], ['ERROR', 'Render thread', 'Fehlende Textur minecraft:block/example'], ['INFO', 'Render thread', 'Sound engine started'], ['INFO', 'Server thread', 'Preparing level "Hauptwelt"'], ['INFO', 'Server thread', 'Preparing spawn area: 64%'], ['INFO', 'Server thread', 'Preparing spawn area: 100%'], ['INFO', 'Render thread', 'Loaded 1204 advancements']];
    clearInterval(logTimer);
    logTimer = setInterval(() => {
      if (S.game.phase !== 'run') { clearInterval(logTimer); return; }
      if (n < script.length) pushLog(i, ...script[n]); else pushLog(i, 'INFO', 'Server thread', ['Saving chunks for level "Hauptwelt"', 'Autosave abgeschlossen', 'Jonas hat den Erfolg [Holz sammeln] erzielt'][n % 3]);
      n++;
      if (S.crashNext && n === 6) crashGame(i);
    }, 650);
  }, 1500);
}
function pushLog(i, lvl, th, msg) {
  const d = new Date(), t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
  const l = [t, lvl, th, msg]; baseLog(i).push(l);
  const cb = $('#cbody');
  if (cb && S.view === 'detail' && S.detail.id === i.id && S.detail.tab === 'log') {
    if (logFilter(l)) { const atEnd = S.detail.follow; cb.insertAdjacentHTML('beforeend', logLine(l)); $('#logNone').style.visibility = 'hidden'; if (atEnd) cb.scrollTop = cb.scrollHeight; }
  }
}
function stopGame() {
  const g = S.game, i = inst(g.id), ran = hms(Date.now() - g.t0);
  clearInterval(logTimer); pushLog(i, 'INFO', 'Render thread', 'Stopping!');
  g.phase = 'idle'; g.id = null;
  paintPlays(); updateLiveBits();
  toast(`Minecraft beendet. Gespielt: ${ran}`, { icon: 'check', act: 'Protokoll', fn: () => openDetail(i.id, 'log') });
}
function cancelPlay() {
  const g = S.game, i = inst(g.id); clearInterval(gameTimer);
  if (g.task) { TASKS.splice(TASKS.indexOf(g.task), 1); }
  g.phase = 'idle'; g.id = null; paintPlays(); paintTasks(true);
  toast(`Vorbereitung von ${i.name} abgebrochen`, { icon: 'info' });
}
function failPlay(msg) {
  const g = S.game; clearInterval(gameTimer);
  g.phase = 'error'; g.err = msg;
  if (g.task) { g.task.state = 'fail'; g.task.label = `${inst(g.id).name}: ${msg}`; g.task.sub = 'Keine Verbindung'; }
  paintPlays(); paintTasks(true);
  toast('Download unterbrochen: keine Verbindung', { kind: 'bad', act: 'Erneut versuchen', fn: () => { const id = g.id; g.phase = 'idle'; g.id = null; startPlay(id); } });
}
function crashGame(i) {
  clearInterval(logTimer); S.crashNext = false;
  pushLog(i, 'ERROR', 'Render thread', 'Reported exception thrown!');
  pushLog(i, 'ERROR', 'Render thread', 'java.lang.NullPointerException: Cannot invoke "net.minecraft.client.render.Camera.getPos()"');
  pushLog(i, 'ERROR', 'main', 'Minecraft wurde mit Code 1 beendet. Absturzbericht: crash-reports/crash-2026-09-29_20.14.03-client.txt');
  S.game.phase = 'crash'; paintPlays(); updateLiveBits(); paintMock();
  toast('Minecraft abgestürzt (Code 1)', { kind: 'bad', act: 'Bericht', fn: crashReport, ms: 9000 });
}
function crashReport() {
  openDlg({ title: 'Absturzbericht', w: 720, h: 520, body: `<p style="margin-bottom:12px">Minecraft ist beim Zeichnen der Welt abgestürzt. Häufige Ursache: eine Mod, die nicht zu ${esc(inst(S.game.id || 'survival').mc)} passt. In dieser Instanz betrifft das <b>Xaero's Minimap</b>.</p><div class="console" style="height:280px"><div class="cbody">${esc('---- Minecraft Crash Report ----\nTime: 2026-09-29 20:14:03\nDescription: Rendering overlay\n\njava.lang.NullPointerException: Cannot invoke "Camera.getPos()"\n\tat xaero.common.minimap.MinimapInterface.render(MinimapInterface.java:212)\n\tat net.minecraft.client.gui.hud.InGameHud.render(InGameHud.java:318)\n\n-- System Details --\nMinecraft Version: 1.21.4\nJava Version: 21.0.5\nMods: fabric-api 0.119.2, lithium 0.15.1, modmenu 13.0.3, xaerominimap 24.6.1')}</div></div>`, foot: `<button class="btn btn-s fx" data-act="toast" data-msg="Absturzbericht kopiert"><span class="bc">${ic('copy')}Kopieren</span></button><button class="btn btn-s fx" data-act="toast" data-msg="Ordner „crash-reports“ geöffnet"><span class="bc">${ic('folder')}Ordner öffnen</span></button><button class="btn btn-p fx" data-act="fixcrash"><span class="bf"></span><span class="bc">Xaero's Minimap ausschalten</span></button>` });
}
setInterval(() => { if (S.game.phase === 'run') $$('[data-runclock]').forEach(el => { el.textContent = hms(Date.now() - S.game.t0); }); }, 1000);
function updateLiveBits() {
  if (S.view === 'detail') { const ls = $('#logStat'); if (ls) { const i = inst(S.detail.id), s = logStat(i); ls.className = 'logstat ' + s.cls; ls.innerHTML = s.h; } }
  paintPlays();
}

/* =====================================================================
   Inhalte
   ===================================================================== */
function catItem(id) { const c = CAT.find(x => x.id === id); return { n: c.n, v: c.id === 'sodium' ? '0.6.13' : '1.0.' + (hash(c.id) % 9), kind: c.kind, on: true, g: c.g, p: c.p, a: c.a, req: c.req }; }
function addItem(iid, x, silent) {
  if (!C[iid]) C[iid] = [];
  if (liveItems(iid).some(y => y.n === x.n)) return;
  x.id = 'c' + (UID++); x.fresh = true; C[iid].push(x);
  if (S.view === 'detail' && S.detail.id === iid && S.detail.tab === 'content') {
    const list = $('.clist') || $('.cgrid');
    if (list && !S.detail.q && (S.detail.kind === 'all' || S.detail.kind === x.kind)) list.insertAdjacentHTML('beforeend', S.detail.mode === 'grid' ? ctile(inst(iid), x) : crow(inst(iid), x));
    else if (!list) { $('#dbody').innerHTML = contentTab(inst(iid)); }
    refreshContentMeta();
  }
  if (!silent) paintCatalogCells();
}
function refreshContentMeta() {
  if (S.view !== 'detail') return;
  const i = inst(S.detail.id), k = kindCounts(i.id), u = updCount(i.id), wt = warnTotal(i.id);
  $$('[data-kc]').forEach(el => { el.textContent = k[el.dataset.kc]; });
  const cc = $('[data-cnt="content"]'); if (cc) cc.textContent = k.all;
  const wd = $('[data-wdot]'); if (wd) { wd.style.visibility = wt ? 'visible' : 'hidden'; wd.dataset.tip = wt + ' Hinweise'; }
  const ua = $('#updAll'); if (ua && !ua._busy) { ua.disabled = !u; $('.bc', ua).innerHTML = `${ic('up')}<span id="updAllT" data-n="${u || ''}">${u ? `Alle aktualisieren (${u})` : 'Alles aktuell'}</span>`; }
  items(i.id).forEach(x => { const w = $(`[data-warns="${x.id}"]`); if (w) { const h = w.classList.contains('tw') ? warnsOf(i.id, x).map(v => `<span class="chip s warn"><i class="sq"></i>${esc(v.t)}</span>`).join('') : warnCell(i.id, x); if (w._h !== h) { w._h = h; w.innerHTML = h; } } });
  const ch = $('#dChips'); if (ch) ch.innerHTML = detailChips(i);
  const pk = $('#pickN'); if (pk) pk.textContent = S.detail.picked.size;
  const t = $('#ctool'); if (t) t.classList.toggle('picking', S.detail.picked.size > 0);
  const all = $('[data-act="pickall"]'); if (all) { const L = visibleItems(i).filter(x => !x.removed); const n = L.filter(x => S.detail.picked.has(x.id)).length; all.checked = n > 0 && n === L.length; all.indeterminate = n > 0 && n < L.length; }
}
function rowOf(cid) { return $(`[data-cid="${cid}"].crow, [data-cid="${cid}"].ctile`); }
function rerow(x) { const el = rowOf(x.id); if (!el) return; const t = document.createElement('div'); t.innerHTML = S.detail.mode === 'grid' ? ctile(inst(S.detail.id), x) : crow(inst(S.detail.id), x); el.replaceWith(t.firstElementChild); }
function removeItems(ids) {
  const iid = S.detail.id, L = items(iid).filter(x => ids.includes(x.id) && !x.removed);
  L.forEach(x => { x.removed = true; S.detail.picked.delete(x.id); rerow(x); });
  refreshContentMeta();
  toast(L.length === 1 ? `${L[0].n} entfernt` : `${L.length} Inhalte entfernt`, { icon: 'trash', act: 'Rückgängig', fn: () => { L.forEach(x => { x.removed = false; rerow(x); }); refreshContentMeta(); } });
}
function purgeRemoved() { Object.keys(C).forEach(k => { C[k] = C[k].filter(x => !x.removed); C[k].forEach(x => delete x.fresh); }); S.detail.picked.clear(); }
function updateItems(ids) {
  const iid = S.detail.id, L = items(iid).filter(x => ids.includes(x.id) && x.up && x.busy == null);
  if (!L.length) return;
  L.forEach(x => { x.busy = 0; const c = $(`[data-upd="${x.id}"]`); if (c) c.innerHTML = updCell(x); });
  const t = setInterval(() => {
    let left = 0;
    L.forEach(x => { if (x.busy == null) return; x.busy = Math.min(1, x.busy + .12 + Math.random() * .06); if (x.busy >= 1) { x.v = x.up; x.up = null; x.busy = null; const r = rowOf(x.id); if (r) { const s = $('[data-sub]', r); if (s) s.textContent = x.dep ? `Benötigt von ${x.reqBy} · ${x.v}` : `${KIND[x.kind]} · ${x.v}${x.on ? '' : ' · aus'}`; } } else left++; const c = $(`[data-upd="${x.id}"]`); if (c) c.innerHTML = updCell(x); });
    if (!left) { clearInterval(t); const ua = $('#updAll'); if (ua) ua._busy = false; refreshContentMeta(); paintNotes(); toast(L.length === 1 ? `${L[0].n} ist aktuell` : `${L.length} Inhalte aktualisiert`); }
  }, 140);
}
function paintNotes() {
  const n = $('#noteMods'); if (!n) return; const u = INST.find(x => updCount(x.id));
  n.style.visibility = u ? 'visible' : 'hidden'; if (u) $('#noteModsT').textContent = `${updCount(u.id)} Updates für ${u.name}`;
}

/* =====================================================================
   Katalog-Panel (im Kontext der Instanz)
   ===================================================================== */
const sheet = $('#sheet');
function openSheet(kind) {
  const i = inst(S.detail.id); S.sheet.open = true; if (kind) S.sheet.kind = kind; S.sheet.q = '';
  if (i.loader === 'Vanilla' && S.sheet.kind !== 'pack') S.sheet.kind = 'pack';
  sheet.style.setProperty('--acc', acc(i));
  sheet.innerHTML = `<div class="sheet-h"><div class="grow"><h2>Inhalte für ${esc(i.name)}</h2><p>Pumpkin Launcher wählt automatisch die Version für ${esc(lv(i))}.</p></div><button class="btn btn-g ib fx" data-act="sheetclose" aria-label="Panel schließen"><span class="bc">${ic('x')}</span></button></div>
    <div class="sheet-t"><div class="seg s" role="tablist" aria-label="Art">${[['mod', 'Mods'], ['shader', 'Shader'], ['pack', 'Ressourcenpakete']].map(([k, t]) => `<button class="fx" role="tab" data-act="skind" data-k="${k}" aria-selected="${S.sheet.kind === k}">${t}</button>`).join('')}</div>
      ${field('sQ', 'Im Katalog suchen', '', 'sq', 's')}
      <label class="row" style="gap:10px;font-size:13px;color:var(--fg-2)">${sw(`data-act="sfit" ${S.sheet.fit ? 'checked' : ''}`, 'Nur passende Inhalte zeigen')}Nur passend zu ${esc(lv(i))}</label></div>
    <div class="sheet-b" id="sheetRes">${sheetRes()}</div>`;
  sheet.classList.add('open');

  setTimeout(() => { const f = $('#sQ'); if (f) f.focus({ preventScroll: true }); }, 60);
}
function closeSheet(silent) { if (!sheet.classList.contains('open')) return; sheet.classList.remove('open'); S.sheet.open = false; if (!silent) { const b = $('[data-act="addcontent"]'); if (b) b.focus({ preventScroll: true }); } }
function sheetRes() {
  const i = inst(S.detail.id), q = S.sheet.q.trim().toLowerCase();
  if (S.offline) return `<div class="offl" style="padding:40px 8px">${ic('plug')}<h2>Keine Verbindung</h2><p>Der Katalog braucht Internet.</p></div>`;

/* =====================================================================
   Layoutshift-Messung (window.__cls, ?cls=1 zeigt die Anzeige)
   ===================================================================== */
window.__cls = { total: 0, entries: [], reset() { this.total = 0; this.entries = []; paintCls(); } };
function paintCls() { const b = $('#clsBadge'); if (!b.hidden) b.textContent = 'Layoutshift ' + window.__cls.total.toFixed(4) + ' (' + window.__cls.entries.length + ')'; }
try {
  new PerformanceObserver(list => {
    for (const en of list.getEntries()) {
      window.__cls.total += en.value;
      window.__cls.entries.push({ v: +en.value.toFixed(5), input: en.hadRecentInput, src: (en.sources || []).map(s => { const n = s.node; if (!n) return '?'; const pr = s.previousRect, cr = s.currentRect; const rr = ' [' + [pr.x, pr.y, pr.width, pr.height].map(Math.round) + ' -> ' + [cr.x, cr.y, cr.width, cr.height].map(Math.round) + ']'; return (n.nodeType === 1 ? (n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') + (n.className && typeof n.className === 'string' ? '.' + n.className.trim().split(/\s+/).slice(0, 3).join('.') : '')) : '#text:' + (n.textContent || '').slice(0, 30)) + rr + (n.parentElement ? ' in ' + (n.parentElement.className || n.parentElement.tagName) : ''); }) , t: Math.round(en.startTime) });
    }
    paintCls();
  }).observe({ type: 'layout-shift', buffered: false });
} catch { }

}
