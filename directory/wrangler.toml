name = "pumpkin-friends-directory"
main = "src/index.js"
compatibility_date = "2025-09-01"
# As in proxy/: any fetch could only reach public addresses. The Worker makes no subrequests at all; the flag is a safety net.
compatibility_flags = ["global_fetch_strictly_public"]

# Nur die feste workers.dev-Adresse; keine Vorschau-Adressen je Version für einen Dienst mit Kontodaten.
workers_dev = true
preview_urls = false

# Die Datenbank wird einmalig mit `wrangler d1 create pumpkin-friends-directory --jurisdiction eu` angelegt
# (die Region lässt sich nur dabei festlegen); die ausgegebene ID kommt anstelle des Platzhalters hierher.
[[d1_databases]]
binding = "DB"
database_name = "pumpkin-friends-directory"
database_id = "7af4829f-d0d1-4b16-bcfa-461ac1df2ca8"

# Grobe Begrenzung je Cloudflare-Standort (Cloudflare erlaubt als Zeitraum nur 10 oder 60 Sekunden).
# `period` muss zu LIMIT_PERIOD in src/index.js passen, das als Retry-After an den Launcher geht.
# Die genauen Kontingente (Briefe pro Tag, je Paar, je Postfach) zählt die Datenbank, nicht diese Bindung.
[[ratelimits]]
name = "LIMITER_IP"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMITER_ACCOUNT"
namespace_id = "1102"
simple = { limit = 30, period = 60 }

# Täglich aufräumen: abgelaufene Briefe, Sendeprotokoll älter als 7 Tage, Einträge ohne Auffrischung seit 30 Tagen.
[triggers]
crons = ["17 3 * * *"]

# Keine Anfragedaten in Logs; Cloudflares Zähler (nur Mengen) laufen weiter.
[observability]
enabled = false
